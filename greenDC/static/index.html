<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenDC Search</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    background: white;
    color: #111418;
    font-family: "Inter", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
  }

  a {
    color: #1a4fa3;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  /* ---------- start page ---------- */

  header {
    max-width: 680px;
    margin: 0 auto;
    padding: 25vh 20px 0;
    text-align: center;
  }

  .logo {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 52px;
    font-weight: 600;
    color: #111418;
  }

  .logo span {
    color: #1a4fa3;
  }

  form {
    display: flex;
    gap: 10px;
    margin-top: 28px;
    padding: 6px 6px 6px 18px;
    border: 1px solid #cfd6e1;
    border-radius: 14px;
  }

  form:focus-within {
    border-color: #1a4fa3;
  }

  input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 17px;
  }

  button {
    background: #1a4fa3;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .examples {
    margin-top: 22px;
    color: #5a6270;
    font-size: 14px;
    line-height: 2;
  }

  .examples a {
    margin: 0 8px;
  }

  /* ---------- results page ---------- */

  body.searched header {
    position: sticky;
    top: 0;
    z-index: 10;
    max-width: none;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 14px 20px;
    text-align: left;
    background: white;
    border-bottom: 1px solid #e2e7ef;
  }

  body.searched .logo {
    font-size: 26px;
  }

  body.searched form {
    width: 640px;
    margin-top: 0;
  }

  body.searched input {
    font-size: 15px;
  }

  body.searched button {
    padding: 8px 16px;
  }

  body.searched .examples {
    display: none;
  }

  main {
    display: none;
    gap: 48px;
    padding: 8px 32px 80px 152px;
  }

  body.searched main {
    display: flex;
  }

  .results {
    width: 680px;
  }

  .count {
    color: #5a6270;
    font-size: 13px;
    margin: 14px 0 6px;
  }

  .result {
    padding: 18px 0;
  }

  .result h2 {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 19px;
    margin: 0 0 4px;
  }

  .meta {
    color: #5a6270;
    font-size: 13px;
    margin-bottom: 6px;
  }

  .snippet {
    margin: 0 0 6px;
  }

  .links a {
    font-size: 13px;
    margin-right: 16px;
  }

  mark {
    background: none;
    color: inherit;
    font-weight: 700;
  }

  #more {
    margin-top: 24px;
    background: white;
    color: #1a4fa3;
    border: 1px solid #e2e7ef;
  }

  /* ---------- summary box on the right ---------- */

  .summary {
    flex: 1;
    max-width: 680px;
    align-self: flex-start;
    position: sticky;
    top: 96px;
    margin-top: 44px;
    padding: 24px 28px;
    border: 1px solid #e2e7ef;
    border-radius: 12px;
    background: #fbfcfe;
  }

  .summary h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #5a6270;
    margin: 0 0 10px;
  }

  .summary ul {
    padding-left: 18px;
  }

  .summary li {
    margin-bottom: 12px;
  }

  .summary li a {
    font-size: 12px;
  }

  .summary .waiting {
    color: #5a6270;
    font-style: italic;
  }

  .summary .note {
    font-size: 12px;
    color: #5a6270;
    margin-top: -6px;
  }

  .summary .note a {
    display: block;
  }

  /* ---------- phones ---------- */

  @media (max-width: 860px) {
    body.searched header {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    body.searched form {
      width: auto;
    }

    body.searched main {
      flex-direction: column-reverse;
      padding: 4px 16px 60px;
    }

    .results {
      width: auto;
    }

    .summary {
      position: static;
      margin-top: 14px;
    }

    /* Show only the first 6 lines of the summary on small screens */
    .summary p {
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">Green<span>DC</span></a>

  <form action="/" method="get">
    <input name="q" id="query" placeholder="Search sustainable data centre research" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="examples">
    Try:
    <a href="/?q=carbon aware workload scheduling">carbon aware workload scheduling</a>
    <a href="/?q=immersion cooling for GPU clusters">immersion cooling for GPU clusters</a>
    <a href="/?q=data centre water consumption">data centre water consumption</a>
    <a href="/?q=power usage effectiveness">power usage effectiveness</a>
  </div>
</header>

<main>
  <div class="results">
    <div class="count" id="count"></div>
    <div id="results"></div>
    <button id="more" hidden>More results</button>
  </div>

  <div class="summary" id="summary" hidden></div>
</main>

<script>
  const query = new URLSearchParams(location.search).get("q") || "";
  let offset = 0;

  // Paper titles and snippets come back from the server already escaped.
  // Other text (authors, the query) is escaped here before it goes into the page.
  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function showResult(result) {
    let authors = result.authors.slice(0, 3).join(", ");
    if (result.authors.length > 3) {
      authors = authors + " et al.";
    }

    let html = '<div class="result" id="' + result.doc_id + '">';
    html += '<h2><a href="/pdf/' + result.doc_id + '" target="_blank">' + result.title_html + '</a></h2>';
    html += '<div class="meta">' + escapeHtml(authors) + ' · ' + (result.year || "") + '</div>';
    html += '<p class="snippet">… ' + result.snippet_html + ' …</p>';
    html += '<div class="links">';
    html += '<a href="/pdf/' + result.doc_id + '" target="_blank">PDF</a>';
    if (result.url) {
      html += '<a href="' + escapeHtml(result.url) + '" target="_blank">Source</a>';
    }
    html += '</div></div>';

    document.getElementById("results").innerHTML += html;
  }

  function showSummary(summary) {
    const box = document.getElementById("summary");
    if (!summary) {
      box.hidden = true;
      return;
    }

    let html = '<h3>Answer</h3>';
    html += '<p id="answer" class="waiting">Writing an answer from the top papers…</p>';
    html += '<h3>Key points from the top results</h3><ul>';
    for (let i = 0; i < summary.key_points.length; i++) {
      const point = summary.key_points[i];
      html += '<li>' + point.sentence_html + ' <a href="#' + point.doc_id + '">↓ ' + (i + 1) + '</a></li>';
    }
    html += '</ul>';

    box.innerHTML = html;
    box.hidden = false;

    showAnswer(summary.abstract_html);
  }

  // The answer is written by the local language model, which takes a few
  // seconds, so it is loaded after the results are already on the page.
  async function showAnswer(abstractHtml) {
    const answerBox = document.getElementById("answer");
    const response = await fetch("/api/answer?q=" + encodeURIComponent(query));
    const data = await response.json();

    answerBox.classList.remove("waiting");

    // If no answer could be made, show the abstract of the top paper instead
    if (!data.answer) {
      answerBox.innerHTML = abstractHtml;
      return;
    }

    // Turn citations like [1] into links to that paper in the results
    let html = escapeHtml(data.answer);
    for (const source of data.sources) {
      const citation = "[" + source.number + "]";
      const link = '<a href="#' + source.doc_id + '" title="' + escapeHtml(source.title) + '">' + citation + '</a>';
      html = html.split(citation).join(link);
    }
    answerBox.innerHTML = html;

    let note = '<p class="note">Written by an AI model from these papers: ';
    for (const source of data.sources) {
      note += '<a href="#' + source.doc_id + '">[' + source.number + '] ' + escapeHtml(source.title) + '</a> ';
    }
    note += '</p>';
    answerBox.insertAdjacentHTML("afterend", note);
  }

  async function search() {
    const response = await fetch("/api/search?q=" + encodeURIComponent(query) + "&offset=" + offset);
    const data = await response.json();

    if (offset === 0) {
      showSummary(data.summary);
      if (data.total_hits === 0) {
        document.getElementById("count").innerHTML = "No results for <b>" + escapeHtml(query) + "</b>.";
      } else {
        document.getElementById("count").textContent = data.total_hits + " results";
      }
    }

    for (const result of data.results) {
      showResult(result);
    }

    offset = offset + data.results.length;
    document.getElementById("more").hidden = offset >= data.total_hits;
  }

  document.getElementById("more").addEventListener("click", search);

  if (query) {
    document.body.classList.add("searched");
    document.getElementById("query").value = query;
    search();
  }
</script>
</body>
</html>
